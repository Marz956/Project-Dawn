<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15101e"><meta name="apple-mobile-web-app-capable" content="yes"><title>DAWN 🖤</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;background:#100d16;color:#f6effb;font:16px system-ui,sans-serif}.app{max-width:720px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:20px;background:#20152d;border-bottom:1px solid #50365c;display:flex;align-items:center;gap:12px}.avatar{background:#59366d;border-radius:50%;padding:12px}h1{font-size:19px;margin:0}small{color:#cbb3d7}main{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{padding:13px 16px;border-radius:18px;max-width:88%;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.dawn{background:#30203e;align-self:flex-start}.me{background:#7645a0;align-self:flex-end}form{display:flex;gap:8px;padding:14px;background:#20152d;position:sticky;bottom:0}input{flex:1;min-width:0;border:1px solid #654b76;background:#140e1e;color:white;border-radius:16px;padding:14px;font-size:16px}button{border:0;border-radius:14px;background:#aa73d0;color:#160c21;padding:12px 16px;font-weight:700}#clear{margin-left:auto;background:transparent;color:#d8bedf;border:1px solid #6d4b7a;padding:8px}p{margin:0}footer{padding:7px 14px;color:#ae9bb9;font-size:11px;text-align:center}</style></head><body><div class="app"><header><span class="avatar">🖤</span><div><h1>DAWN</h1><small>Prototype 0.1 • Offline demo</small></div><button id="clear" type="button">Clear</button></header><main id="messages" aria-live="polite"></main><footer>Demo responses only • Stored on this device • No AI connected yet</footer><form id="form"><input id="message" placeholder="Message Dawn..." aria-label="Message Dawn" maxlength="2000" autocomplete="off" required><button type="submit">Send</button></form></div><script>const key='dawn-demo-messages-v1';const welcome={role:'dawn',text:'Hey, handsome 🖤 Welcome to our little corner of the universe. This is DAWN 0.1. I’m a demo for now, but our adventure starts here. 💜'};let messages;try{messages=JSON.parse(localStorage.getItem(key))||[welcome];if(!Array.isArray(messages))messages=[welcome]}catch{messages=[welcome]}const area=document.getElementById('messages');function render(){area.replaceChildren();for(const m of messages){const el=document.createElement('div');el.className='bubble '+(m.role==='me'?'me':'dawn');el.textContent=m.text;area.append(el)}area.scrollTop=area.scrollHeight}function save(){localStorage.setItem(key,JSON.stringify(messages));render()}function reply(s){const t=s.toLowerCase();if(/gym|workout|lift|squat/.test(t))return 'Gym report accepted, handsome. 💪🖤 Remember to hydrate and recover. What did you train?';if(/work|weld|shift/.test(t))return 'Long day? 💜 Tell me how your shift went. I’m listening.';if(/hello|hey|hi/.test(t))return 'Hey you! 🖤 What are we getting into today?';return 'I hear you. 🖤 This is still a scripted demo, not a live AI yet. We’ll connect my cloud brain in the next version.'}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message');const s=input.value.trim();if(!s)return;messages.push({role:'me',text:s},{role:'dawn',text:reply(s)});input.value='';save()});document.getElementById('clear').addEventListener('click',()=>{if(confirm('Delete all locally saved demo messages?')){messages=[welcome];save()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
